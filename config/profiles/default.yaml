# PDK profile.
# Generated by auto-ext migrate from project.yaml + tasks.yaml.
# Both source files were left untouched. This file is never overwritten by a
# second migration: delete it if you want it regenerated.
# Lines marked NEEDS CONFIRMATION carry a value nobody has checked against a
# real tool yet -- see the migration report and docs/refactor/OFFICE_TODO.md.
schema_version: 1
profile_id: default
display_name: migrated PDK
description: Migrated from project.yaml and the templates it pointed at.
tech_name:
tech_name_env_vars:
- PDK_TECH_FILE
- PDK_LAYER_MAP_FILE
- PDK_DISPLAY_FILE
tech_library_file: $env(SETUP_ROOT)/assura_tech.lib
layer_map: ${PDK_LAYER_MAP_FILE}
# NEEDS CONFIRMATION: one CDL prelude is assumed. Multiple
# preludes are not supported yet.
cdl_include_files:
- $calibre_source_added_place
env_overrides: {}
required_env:
- PDK_LAYER_MAP_FILE
- SETUP_ROOT
- VERIFY_ROOT
- WORK_ROOT
- WORK_ROOT2
- calibre_source_added_place
# CONFIRMED 2026-08-24 by `ls` on the real deck directory. Both variants exist
# as real files, so `widio` is no longer manifest-only folklore.
# Also learned there: each variant ships TWO files, `.qcilvs` AND a `.lvs`
# sibling (`<basename>.wodio.lvs` / `.wodio.qcilvs`, same for widio), plus an
# unsuffixed `<basename>.lvs` and an `empty.cdl`. We want the `.qcilvs` one --
# that is the Calibre-for-QRC (QCI) deck the runset sample uses -- so
# filename_pattern stays pinned to `.qcilvs` rather than globbing `.lvs*`.
lvs_decks:
  dir_expr: $calibre_source_added_place|parent
  basename:
  filename_pattern: '{basename}.{suffix}.qcilvs'
  variants:
  - name: wodio
    rules_suffix: wodio
    description:
    connect_by_name_default:
  - name: widio
    rules_suffix: widio
    description:
    connect_by_name_default:
  default_variant: wodio
  runset_version:
qrc:
  dir_expr: $VERIFY_ROOT/runset/Calibre_QRC/QRC/<runset>/<pdk_subdir>/QCI_deck
  query_cmd_name: query_cmd
  preserve_cell_list_name: preserveCellList.txt
  runset_version:
extra_paths: {}
# CONFIRMED 2026-08-24 against the Quantus GUI RuleSet list on the real PDK.
# This PDK offers exactly these nine and nothing else. Note which generation of
# corner naming won: the plain CBEST/CWORST/RCBEST/RCWORST set, each with a
# `_T` sibling. The CBEST_CCBEST / RCWORST_CCWORST generation that the draft
# catalog also listed does NOT exist here -- shipping the union would have made
# half the dropdown invalid, which is why this was a hard blocker.
# `assura_tech.lib` was the wrong place to look: `grep -i corner` on it returns
# nothing. The corner list lives in the Quantus RuleSet, not the tech lib.
corners:
- name: typical
  technology_corner: TYPICAL
  default_temperature_c:
  aliases: []
  description: Nominal RC. The corner the pre-refactor templates hardcoded.
- name: cbest
  technology_corner: CBEST
  default_temperature_c:
  aliases: []
  description: Best-case capacitance.
- name: cbest_t
  technology_corner: CBEST_T
  default_temperature_c:
  aliases: []
  description: Best-case capacitance, `_T` variant.
- name: cworst
  technology_corner: CWORST
  default_temperature_c:
  aliases: []
  description: Worst-case capacitance.
- name: cworst_t
  technology_corner: CWORST_T
  default_temperature_c:
  aliases: []
  description: Worst-case capacitance, `_T` variant.
- name: rcbest
  technology_corner: RCBEST
  default_temperature_c:
  aliases: []
  description: Best-case RC.
- name: rcbest_t
  technology_corner: RCBEST_T
  default_temperature_c:
  aliases: []
  description: Best-case RC, `_T` variant.
- name: rcworst
  technology_corner: RCWORST
  default_temperature_c:
  aliases: []
  description: Worst-case RC.
- name: rcworst_t
  technology_corner: RCWORST_T
  default_temperature_c:
  aliases: []
  description: Worst-case RC, `_T` variant.
default_corner: typical
