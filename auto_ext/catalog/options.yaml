  - key: output_form
    tier: common
    template_var: output_form
    context_path: recipe.output.emit
    owner: recipe
    type: list
    choices: [extracted_view, dspf]
    choices_confidence: certain
    default: [extracted_view]
    currently: config_field
    observed: true
    source_ref: auto_ext/core/config.py:85
    question: Do you ever need an extracted view AND a DSPF from one run? Do you need SPEF?
    notes: >-
      Certain, not likely, and more serious than the draft made it look:
      TemplatePaths has exactly ONE quantus slot, so a single run structurally
      cannot produce both files today. Choosing between them is done by
      pointing a template path at a different file. Turning that into a list
      is the headline feature of removing the template slots.
      The two forms differ in more than which options are legal. With LVS
      input, output files are AUTO-SPLIT at 2 GB with numeric suffixes .1,
      .2 and so on -- the only exception being compressed SPEF/DSPF, which
      stay one file. extracted_view / lvs_extracted_view are neither split
      nor compressible. So anything downstream that reads a DSPF must cope
      with shards (an RF top level reaches 2 GB without trying), while the
      extracted_view branch must not go looking for them. This is why
      requires_emit is a real dimension on every output_db row rather than
      bookkeeping.
      One flow restriction worth recording: the DFII extracted-view output
      form requires LVS INPUT and is unreachable from a DEF/OA input_db.
      Satisfied vacuously while input_db_type is fixed to calibre; it becomes
      a live constraint the moment that stops being true.
    lands_in:
      - {target: quantus.ext.cmd, section: output_db, option: -type, line: 42, layout: own_line, indent: 0}
      - {target: quantus.dspf.cmd, section: output_db, option: -type, line: 42, layout: own_line, indent: 0}
    why: Which artifacts the extraction produces. The defining choice of a recipe.

