# Auto_ext built-in parameter catalog.
#
# ONE row per parameter -- not per line of output. A parameter written into
# three files (``output_dir``) is one row with three landing sites; a line that
# carries three parameters (``*lvsRulesFile``) is three rows.
#
# Reading the columns
# -------------------
# key                 snake_case name of this parameter inside Auto_ext.
# template_var        the Jinja variable it is (or will be) bound to in the
#                     FLAT legacy namespace. For ``currently: jinja_var`` and
#                     ``manifest_knob`` rows this is verifiable today by
#                     grepping the .j2, and tests/catalog/test_catalog.py
#                     asserts it in both directions. For every other row it is
#                     the name the catalog-driven renderer will bind, reserved
#                     here so importer and patch baselines have one agreed name
#                     per value. Catalog key and template var are NOT always
#                     equal (``min_res_ohm`` -> ``min_res``); recording that
#                     mapping is the whole reason this column exists.
# context_path        namespaced key in the new render context (01-schema.md
#                     section 4). ``null`` = not exposed to templates.
# owner               WHICH OBJECT HOLDS IT, and nothing else. One of
#                     recipe / profile / cells / run / resources / fixed.
#                     Template section is a separate column, on the landing
#                     site (``section``) -- conflating the two is what made the
#                     two draft catalogs unmergeable.
# type                str | int | float | bool | enum | list | path | structural
# choices             candidate legal values. Read them WITH
#                     choices_confidence: ``guess`` means "do not build a combo
#                     box out of this" -- but see DECISIONS.md #19, REVISED
#                     2026-08-24: it now means an EDITABLE combo box. The
#                     members are offered so there is always something legal-
#                     looking to pick, and anything else can still be typed,
#                     so a wrong guess here cannot lock a user out of the
#                     spelling their tool wants. A bare text box, which is
#                     what this used to mean, told the user nothing at all.
# choices_from        a PdkProfile table that supersedes ``choices`` once a
#                     profile is loaded: profile.corners /
#                     profile.lvs_decks.variants. ``choices`` stays as the
#                     no-profile fallback and as the record of what one real
#                     PDK answered. Which corners exist is a process fact, so
#                     freezing them in this file is right for exactly one PDK.
# nullable            the model field takes null, and null means "resolve it
#                     elsewhere" (the profile for a corner, the DUT for the
#                     view to reduce). The form shows an explicit
#                     "(from the profile)" entry, not an empty control.
# placeholder         grey text for an empty control when ``default`` is null.
# choices_confidence  certain | likely | guess -- how sure the VALUE SET is.
#                     Deliberately NOT the same column as ``observed``: a value
#                     can be certainly hardcoded (observed) while its legal
#                     alternatives are pure guesswork.
# range               inclusive [lo, hi], int/float only.
# range_verified      false on every row in this file. Not one range here has
#                     been checked against a tool manual -- they are guard
#                     rails someone invented, and reading them as spec is a
#                     bug. Only a real datasheet flips one to true.
# unit                display only, and itself sometimes wrong -- see
#                     coupling_cap_threshold_absolute.
# default             today's effective value.
# currently           how the value reaches the file TODAY:
#                     manifest_knob     - [[var]] plus a knob in a manifest
#                     jinja_var         - [[var]] fed by runner._build_context
#                     hardcoded_literal - typed into the .j2
#                     python_argv       - assembled in auto_ext/tools/*.py
#                     config_field      - a ProjectConfig/TaskSpec field that
#                                         never reaches a template as [[var]]
#                     absent            - we do not emit it at all
# observed            true = transcribed out of a file in this repo, with
#                     source_ref naming file and line. Always certain when
#                     true, because it is a transcription and not a judgement.
#                     false = proposed, exists nowhere yet. ``observed: true``
#                     together with ``currently: absent`` means "seen in a real
#                     export, but our renderer drops it".
# source_ref          file:line backing ``observed``.
# lands_in            every place the value is written: target / section /
#                     option / line, plus that site's rendering rule.
# question            an unanswered question this row depends on; the same
#                     items are listed in docs/refactor/OFFICE_TODO.md.
#
# Rendering rules
# ---------------
# Each ``targets:`` entry declares the file default quoting / layout / indent;
# a landing site names only what differs. This is not decoration. The patch
# escape hatch diffs against the GENERATED text, so a catalog that cannot
# reproduce a file exact quoting and line breaks repaints the whole file on
# upgrade and buries the user real edits in noise.
#   quoting: bare | double | skill_bool | skill_list | xml_attr | tcl_brace | none
#   layout:  own_line | inline | value_on_next_line | value_per_line | packed
#   indent:  leading spaces
#   continuation: emits a trailing " \" (Quantus command files)
#   optional: line is conditional -> MUST use the hugging
#             "[% if x %]LINE" / "[% endif %]NEXT" form, because trim_blocks is
#             OFF and an ordinary block emits a stray blank line.
#
# Counting note: the 7 knobs that exist today are 5 in each quantus manifest
# (same 5, declared twice) plus lvs_variant and connect_by_name in the calibre
# manifest. si and jivaro manifests declare none.

schema_version: 1

# Bumped whenever the DATA below changes. TemplatePatch.base.catalog_version
# records it, so a conflict report can name the catalog that moved.
catalog_version: "2026.08.24"

# How the Recipes form titles each template section -- level 2 of its
# grouping, where level 1 is the tool. Twenty-three rows for the whole
# catalog, authored ONCE PER SECTION and never per option: adding an option
# touches this table never, adding a template section touches it once.
#
# Three operations, all needed:
#   rename  = label            device_check reads "device checks"
#   merge   = a shared group   sections in one group render as one heading,
#                              taking the label of the lowest-ordered member
#   split   = split_by         output_db becomes one heading per emitted
#                              format, because the vendor documents four
#                              DIFFERENT option sets under that one name
#
# `tool` is the template_id's directory, not the target id: quantus.ext.cmd
# and quantus.dspf.cmd share eight of these sections with the same meaning,
# and one heading must not have two places to change it.
#
# A section missing from this table is not an error. It renders under its raw
# name, sorted last -- ugly, visible, and fixable in one line.
sections:
  # -- si.env ---------------------------------------------------------------
  - {tool: si, section: device_check,       label: device checks,               group: device_checks,     order: 10}
  - {tool: si, section: device_preserve,    label: preserve & netlist,          group: preserve_netlist,  order: 20}
  - {tool: si, section: netlist_control,    label: preserve & netlist,          group: preserve_netlist,  order: 21}
  - {tool: si, section: globals,            label: "globals, scale & thresholds", group: globals_scale,     order: 30}
  - {tool: si, section: device_reduction,   label: "globals, scale & thresholds", group: globals_scale,     order: 31}

  # -- calibre lvs.qci ------------------------------------------------------
  - {tool: calibre, section: lvs_rules,     label: deck & rules,                group: lvs_deck,          order: 10}
  - {tool: calibre, section: lvs_devices,   label: devices & filters,           group: lvs_devices,       order: 20}
  - {tool: calibre, section: lvs_options,   label: options,                     group: lvs_options,       order: 30}
  - {tool: calibre, section: cmn_options,   label: options,                     group: lvs_options,       order: 31}
  - {tool: calibre, section: lvs_triggers,  label: triggers,                    group: lvs_triggers,      order: 40}

  # -- quantus ext.cmd + dspf.cmd -------------------------------------------
  # The first eight are shared by both command files; the last three are
  # written only by dspf.cmd.
  - {tool: quantus, section: extract,             label: extract,              group: extract,            order: 10}
  - {tool: quantus, section: process_technology,  label: process & technology, group: process,            order: 20}
  - {tool: quantus, section: input_db,            label: input,                group: input_db,           order: 25}
  - {tool: quantus, section: extraction_setup,    label: extraction setup,     group: extraction_setup,   order: 30}
  - {tool: quantus, section: capacitance,         label: capacitance,          group: capacitance,        order: 40}
  - {tool: quantus, section: filter_cap,          label: capacitance,          group: capacitance,        order: 41}
  - {tool: quantus, section: filter_coupling_cap, label: capacitance,          group: capacitance,        order: 42}
  - {tool: quantus, section: filter_res,          label: resistance,           group: resistance,         order: 50}
  - {tool: quantus, section: metal_fill,          label: metal fill,           group: metal_fill,         order: 60}
  - {tool: quantus, section: output_db,           label: output_db,            group: output_db,          order: 80, split_by: requires_emit}
  - {tool: quantus, section: output_setup,        label: output setup,         group: output_setup,       order: 90}

  # -- jivaro default.xml ---------------------------------------------------
  - {tool: jivaro, section: reduction,      label: reduction,                   group: reduction,         order: 10}
  - {tool: jivaro, section: general,        label: logging & general,           group: general,           order: 20}

targets:
  - id: si.env
    stage: si
    template: templates/si/default.env.j2
    template_id: si/default.env.j2
    syntax: skill
    quoting: double
    layout: own_line
    indent: 0
    continuation: false
    preserve_order: true
    notes: >-
      SKILL assignments, one per line. Booleans are "'t" / "'nil"; line 6 is a
      bare "nil" (historical noise -- normalise to "'nil" on regeneration).
      Field order is the order si exported them, not a logical order:
      checkCAPPERI (line 22) sits after the diode group instead of with the
      cap group. Regrouping it would diff against every real si.env our users
      hold, so emission order is pinned to the line numbers below.
      One invariant here is not a field at all: when simRunDir is missing, si
      writes the netlist into cwd and Quantus never finds it (Cadence bug
      LBRCXM-756). core/importer.py:476-485 injects the line on import, and
      the renderer must always emit it.

  - id: lvs.qci
    stage: calibre
    template: templates/calibre/calibre_lvs.qci.j2
    template_id: calibre/calibre_lvs.qci.j2
    syntax: calibre_runset
    quoting: bare
    layout: own_line
    indent: 0
    continuation: false
    preserve_order: true
    notes: >-
      "*key: value", one per line, values unquoted. Tcl brace literals appear
      verbatim in the trigger and slave-table rows, which is exactly why the
      Jinja delimiters in this project are [[ ]] and not the default braces.
      Line 31 is the only conditional line in the whole template and uses the
      hugging form; core/importer.py:355-400 anchors on "*cmnShowOptions:"
      when injecting, so that row must keep its position relative to it.
      A real export also carries a "==<name>==" section header
      (docs/calibre_raw.txt:1) that this template does not emit -- see
      runset_section_header.

  - id: quantus.ext.cmd
    stage: quantus
    template: templates/quantus/ext.cmd.j2
    template_id: quantus/ext.cmd.j2
    syntax: quantus_cmd
    quoting: double
    layout: inline
    indent: 14
    continuation: true
    preserve_order: true
    header_option: quantus_cmd_header
    notes: >-
      Command sections: each command name on column 0, its argument lines
      indented 14 spaces, every line but the last of a section ending in a
      backslash continuation. Quoting is per-argument and genuinely
      inconsistent in the source (line 14 "auto" bare, line 17 quoted; line 21
      "true" bare, line 48 quoted) -- reproduced here exactly, not normalised.
      Emits an extracted view, whose artifact is a DFII library/cell/view
      triple rather than a file, which is why output_setup has no -file_name.

  - id: quantus.dspf.cmd
    stage: quantus
    template: templates/quantus/dspf.cmd.j2
    template_id: quantus/dspf.cmd.j2
    syntax: quantus_cmd
    quoting: double
    layout: inline
    indent: 14
    continuation: true
    preserve_order: true
    header_option: quantus_cmd_header
    notes: >-
      Same file format as quantus.ext.cmd and about 90% the same lines. It
      differs by exactly: no -design_cell_name / -format /
      -device_properties_file, an extra metal_fill section, an input_db
      -hierarchy_delimiter, the whole output_db block, and output_setup
      -file_name / -net_name_space. ProjectConfig.templates has ONE quantus
      slot, so today a run emits this OR the extracted view and never both;
      recipe.output.emit is what removes that limit.

  - id: jivaro.xml
    stage: jivaro
    template: templates/jivaro/default.xml.j2
    template_id: jivaro/default.xml.j2
    syntax: xml
    quoting: xml_attr
    layout: packed
    indent: 0
    continuation: false
    preserve_order: true
    notes: >-
      NOT pretty-printed XML. Line 1 carries four tags, line 21 carries a
      comment plus two closing tags, and the middle is one element per line
      with no indentation. Re-emitting this as conventionally indented XML
      would diff against the entire file, so the packing is part of the
      contract. Comment lines act as section markers.

options:

  # ---- identity: the DUT. Owner is the Cells table, never a Recipe. --------

  - key: library
    tier: identity
    screen: cells
    template_var: library
    context_path: library
    owner: cells
    type: str
    default: null
    choices_confidence: certain
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:1
    lands_in:
      - {target: si.env, section: identity, option: simLibName, line: 1}
      - {target: lvs.qci, section: lvs_layout, option: "*lvsLayoutLibrary", line: 5}
      - {target: lvs.qci, section: lvs_source, option: "*lvsSourceLibrary", line: 10}
      - {target: lvs.qci, section: cmn_fdi, option: "*cmnFDILayoutLibrary", line: 42}
      - {target: quantus.ext.cmd, section: input_db, option: -design_cell_name, line: 33}
      - {target: jivaro.xml, section: general, option: inputView, line: 2}
    why: >-
      One column of the cell table. A Recipe that named a library would stop
      being portable, which is the one property a Recipe has to keep.

  - key: cell
    tier: identity
    screen: cells
    template_var: cell
    context_path: cell
    owner: cells
    type: str
    default: null
    choices_confidence: certain
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:2
    lands_in:
      - {target: si.env, section: identity, option: simCellName, line: 2}
      - {target: lvs.qci, section: lvs_layout, option: "*lvsLayoutPrimary", line: 4}
      - {target: lvs.qci, section: lvs_source, option: "*lvsSourcePrimary", line: 9}
      - {target: quantus.ext.cmd, section: input_db, option: -design_cell_name, line: 33}
      - {target: jivaro.xml, section: general, option: inputView, line: 2}
      - {target: null, stage: strmout, section: argv, option: -topCell, line: null}
    notes: >-
      The cell name is also baked into seven derived file names, each of which
      is its own row: netlist_out_name, layout_db_name, lvs_spice_file,
      erc_database, erc_summary_file, lvs_report_file, fdi_def_layout_path.
    why: One column of the cell table; the primary axis of a run.

  - key: layout_view
    tier: identity
    screen: cells
    template_var: lvs_layout_view
    context_path: lvs_layout_view
    owner: cells
    type: str
    default: layout
    choices_confidence: certain
    currently: jinja_var
    observed: true
    source_ref: templates/calibre/calibre_lvs.qci.j2:6
    lands_in:
      - {target: lvs.qci, section: lvs_layout, option: "*lvsLayoutView", line: 6}
      - {target: lvs.qci, section: cmn_fdi, option: "*cmnFDILayoutView", line: 43}
      - {target: quantus.ext.cmd, section: input_db, option: -design_cell_name, line: 33}
      - {target: null, stage: strmout, section: argv, option: -view, line: null}
    notes: >-
      Catalog key drops the lvs_ prefix (CellEntry.layout_view) but the
      template var keeps it, because renaming it in five templates buys
      nothing. This row is the mapping.
    why: One column of the cell table.

  - key: source_view
    tier: identity
    screen: cells
    template_var: lvs_source_view
    context_path: lvs_source_view
    owner: cells
    type: str
    default: schematic
    choices_confidence: certain
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:3
    lands_in:
      - {target: si.env, section: identity, option: simViewName, line: 3}
      - {target: lvs.qci, section: lvs_source, option: "*lvsSourceView", line: 11}
    why: One column of the cell table.

  - key: ground_net
    tier: elsewhere
    screen: cells
    template_var: ground_net
    context_path: ground_net
    owner: cells
    type: str
    default: vss
    choices_confidence: certain
    currently: jinja_var
    observed: true
    source_ref: auto_ext/core/config.py:245
    lands_in:
      - {target: quantus.ext.cmd, section: capacitance, option: -ground_net, line: 9}
      - {target: quantus.dspf.cmd, section: capacitance, option: -ground_net, line: 9}
    notes: >-
      The draft catalog said "gnd!" and marked it certain. It is "vss":
      TaskSpec.ground_net defaults to vss (config.py:245) and both shipped
      tasks.yaml files say vss. The template itself carries no default, only
      the variable.
    why: >-
      Per-DUT: which net Quantus grounds capacitance to. A cell table column,
      not an extraction condition.

  - key: out_file
    tier: elsewhere
    screen: cells
    template_var: out_file
    context_path: out_file
    owner: cells
    type: str
    default: av_ext
    choices_confidence: certain
    currently: jinja_var
    observed: true
    source_ref: examples/legacy/config/tasks.yaml:26
    lands_in:
      - {target: quantus.ext.cmd, section: output_db, option: -view_name, line: 55}
      - {target: jivaro.xml, section: general, option: inputView, line: 2}
      - {target: jivaro.xml, section: general, option: outputView, line: 3}
    notes: >-
      TaskSpec.out_file itself defaults to None; av_ext is what both shipped
      tasks.yaml files carry. Note the collision with
      reduction_views_to_reduce, which is hardcoded to a DIFFERENT name.
    why: >-
      Names the extracted view this DUT produces, and therefore the view
      Jivaro reads. Per-DUT, so it belongs to the cell table.

  # ---- si.env: CDL netlisting ---------------------------------------------
  # Every one of these is hardcoded in the template today and the si manifest
  # declares zero knobs, so not a single one of them can be changed right now.

  - key: netlist_simulator
    template_var: sim_simulator
    context_path: recipe.netlist.simulator
    owner: recipe
    type: enum
    choices: [auCdl, spectre, hspiceD]
    choices_confidence: guess
    default: auCdl
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:4
    lands_in:
      - {target: si.env, section: netlist_control, option: simSimulator, line: 4}
    notes: >-
      Only auCdl has ever been used here, and auCdlDefNetlistProc /
      hnlNetlistFileName below assume it. The other two are candidates, not
      verified alternatives.
    why: >-
      Which netlister si runs. Changing it changes the netlist syntax Calibre
      then reads, so it is an extraction condition and belongs to the Recipe.

  - key: netlist_not_incremental
    template_var: sim_not_incremental
    context_path: recipe.netlist.not_incremental
    owner: recipe
    type: bool
    choices_confidence: certain
    default: true
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:5
    lands_in:
      - {target: si.env, section: netlist_control, option: simNotIncremental, line: 5, quoting: skill_bool}
    notes: >-
      The draft proposed folding this and simReNetlistAll into one tri-state
      enum. That is wrong: "no incremental netlist" plus "do not force a
      re-netlist of every cellview" is a normal, and the currently shipped,
      combination, and a tri-state cannot express it. Two independent booleans.
    why: Controls whether si reuses a previous netlist. Directly an extraction condition.

  - key: netlist_renetlist_all
    template_var: sim_renetlist_all
    context_path: recipe.netlist.renetlist_all
    owner: recipe
    type: bool
    choices_confidence: certain
    default: false
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:6
    lands_in:
      - {target: si.env, section: netlist_control, option: simReNetlistAll, line: 6, quoting: skill_bool}
    notes: >-
      Line 6 is the one bare "nil" in the file; every other false is "'nil".
      Regeneration normalises it, which is a deliberate one-line diff against
      the current template.
    why: Forces every cellview to be re-netlisted. An extraction condition.

  - key: netlist_view_list
    template_var: sim_view_list
    context_path: recipe.netlist.view_list
    owner: recipe
    type: list
    choices_confidence: likely
    default: [auCdl, schematic]
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:7
    lands_in:
      - {target: si.env, section: netlist_control, option: simViewList, line: 7, quoting: skill_list}
    why: >-
      The cellview search order si walks. A design that keeps its CDL under a
      different view name cannot be netlisted without changing this.

  - key: netlist_stop_list
    template_var: sim_stop_list
    context_path: recipe.netlist.stop_list
    owner: recipe
    type: list
    choices_confidence: likely
    default: [auCdl]
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:8
    lands_in:
      - {target: si.env, section: netlist_control, option: simStopList, line: 8, quoting: skill_list}
    why: >-
      Where si stops descending. Decides how deep the netlist goes, which is
      an extraction condition.

  - key: netlist_out_name
    template_var: hnl_netlist_file_name
    context_path: null
    owner: fixed
    type: str
    choices_confidence: certain
    default: "{cell}.src.net"
    currently: hardcoded_literal
    observed: true
    source_ref: templates/si/default.env.j2:9
    lands_in:
      - {target: si.env, section: output, option: hnlNetlistFileName, line: 9}
      - {target: lvs.qci, section: lvs_source, option: "*lvsSourcePath", line: 8}
    notes: >-
      A cross-file hard coupling: si writes this name and the Calibre runset
      reads it. Two files, one literal, no shared definition today -- exactly
      the class of bug this catalog exists to remove. Fixed rather than
      exposed because there is no reason to change it and every reason for
      both sides to agree.
    why: Producer/consumer contract between the si and calibre stages.

  - key: netlist_resistor_model
    template_var: resistor_model
    context_path: null
    owner: fixed
    type: str
    choices_confidence: guess
    default: ""
    currently: hardcoded_literal
    observed: true
    source_ref: templates/si/default.env.j2:11
    notes: >-
      Empty in every sample. The draft bundled this with pinMAP and setEQUIV
      as one "rarely used fields" row; splitting them was worth it, because
      pinMAP turns out not to be a string at all (see netlist_pin_map).
    lands_in:
      - {target: si.env, section: device_reduction, option: resistorModel, line: 11}
    why: Empty everywhere we have seen; kept literal so the file stays complete.

  - key: netlist_short_res
    template_var: short_res
    context_path: recipe.netlist.short_res_ohm
    owner: recipe
    type: float
    choices_confidence: guess
    unit: ohm
    default: 2000.0
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:12
    question: >-
      Is a resistor shorted BELOW this value or above it? Is the unit ohms?
      Does it have to agree with the Calibre deck?
    lands_in:
      - {target: si.env, section: device_reduction, option: shortRES, line: 12, quoting: bare}
    why: >-
      Decides which resistors si collapses to shorts, i.e. what the LVS source
      netlist even contains. One of the sharpest extraction conditions in the
      flow, and it is currently unreachable.

  - key: netlist_preserve_res
    template_var: preserve_res
    context_path: recipe.netlist.preserve_res
    owner: recipe
    type: bool
    choices_confidence: certain
    default: true
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:13
    lands_in:
      - {target: si.env, section: device_preserve, option: preserveRES, line: 13, quoting: skill_bool}
    why: Keep resistors in the source netlist. Changes what LVS has to match.

  - key: netlist_check_res_val
    template_var: check_res_val
    context_path: recipe.netlist.check_res_val
    owner: recipe
    type: bool
    choices_confidence: certain
    default: true
    currently: jinja_var
    observed: true
    source_ref: templates/si/default.env.j2:14
    lands_in:
      - {target: si.env, section: device_check, option: checkRESVAL, line: 14, quoting: skill_bool}
    why: Emits resistor values for LVS to compare. An LVS-matching condition.

  - key: netlist_check_res_size
    template_var: check_res_size
    context_path: recipe.netlist.check_res_size
