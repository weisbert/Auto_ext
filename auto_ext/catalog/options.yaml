  - key: extract_selection
    tier: common
    template_var: extract_selection
    context_path: recipe.extraction.extract
    describes_member: true
    owner: recipe
    type: enum
    choices: [all, net, nets_file, selected_path_file]
    choice_args:
      net: net-name pattern
      nets_file: file listing net names
      selected_path_file: file listing selected paths
    choices_confidence: certain
    default: all
    currently: jinja_var
    observed: true
    source_ref: templates/quantus/ext.cmd.j2:11
    notes: >-
      Four members, and THREE OF THEM TAKE AN OPERAND -- see choice_args.
      The set this row used to carry (all / specified_nets / selected_nets)
      had two spellings that do not exist, and even the real ones were
      unusable: the template emitted -selection "[[extract_selection]]" as a
      bare quoted token, so picking any operand-bearing member produced a
      command line the tool rejects.
      This row now describes the members of one rule in
      extraction.extract[]. It is not a scalar setting any more: `extract` is
      a repeatable command whose specifications accumulate first-to-last with
      the LAST ONE WINNING for any net it covers, which is what makes the
      standard RF strategy -- whole chip at c_only_coupled, the nets that
      matter at rc_coupled -- expressible at all.
    lands_in:
      - {target: quantus.ext.cmd, section: extract, option: -selection, line: 11}
      - {target: quantus.dspf.cmd, section: extract, option: -selection, line: 11}
    why: Which nets one extract statement covers. Ordered; later rules win.

  - key: extract_type
    tier: common
    template_var: extract_type
    context_path: recipe.extraction.extract
    describes_member: true
    owner: recipe
    type: enum
    choices:
      - none
      - substrate_only
      - r_only
      - c_only_decoupled
      - c_only_coupled
      - c_only_decoupled_to_substrate
      - rc_decoupled
      - rc_coupled
      - rc_decoupled_to_substrate
      - rlc_decoupled
      - rlc_coupled
      - rlc_decoupled_to_substrate
      - rlck_decoupled
      - rlck_coupled
      - rlck_decoupled_to_substrate
    choices_confidence: certain
    default: rc_coupled
    currently: jinja_var
    observed: true
    source_ref: templates/quantus/ext.cmd.j2:12
    notes: >-
      Fifteen values, from the extract syntax table, and every one of them is
      usable in our flow: the members restricted to LVS input are exactly the
      ones a Calibre-svdb run qualifies for.
      Three of the four spellings this row used to carry were wrong. c_only
      does not exist -- it is c_only_coupled or c_only_decoupled, and which
      one you mean is the whole question. The earlier draft listed rcc and
      rlck, which do not exist either; they were dropped as unverified before
      the table was read, which turned out to be right for the wrong reason.
      This also answers "only resistance" (r_only) and "only capacitance"
      (c_only_coupled with coupling, c_only_decoupled without).
      RLCK still needs the inductor half of the parasitic device contract
      (-ind_component / -mutual_ind_component), which neither template emits,
      so choosing an rlc or rlck member today gets an incomplete deck. That
      is a template gap, not a value-set one.
    lands_in:
      - {target: quantus.ext.cmd, section: extract, option: -type, line: 12}
      - {target: quantus.dspf.cmd, section: extract, option: -type, line: 12}
    why: >-
      The single most important extraction condition. C-only for early
      iteration, RC-coupled for signoff -- and today it cannot be changed.


  - key: use_field_solver
