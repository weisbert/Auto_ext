      The note that stood here -- "no multi_cpu section exists in either
      template, so extraction is single-threaded today" -- was FALSE, and it
      is worth saying so plainly because a question to the office was about
      to be built on that premise. With no distributed_processing section
      Quantus defaults to TWO CPUs, not one. Hence default 2: this row
      records what the tool actually does when we emit nothing.
      Licensing is a hard ceiling, not a guideline: a run on N processors
      consumes ceil(N/2) licences, which is exactly why two CPUs is the free
      default.
      Scheduler integration: only -multi_cpu, -lsf_number and -multi_machine
      are supported in transistor-level flows. The -sge_number/-sge_command
      and -drm_number/-drm_command pairs exist in Quantus but are explicitly
      NOT supported here, so a future reader shopping for a grid scheduler
      should stop looking for them.
