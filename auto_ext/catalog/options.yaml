      differ and the literal was never a setting.
      Default is now null, meaning "the cell's out_file", resolved in
      core/render.py::_recipe_tree against the DutSnapshot. It stays
      overridable rather than being deleted, because reducing a view an
      earlier run produced -- Jivaro on its own, no extraction this time --
      is the one case where naming it explicitly is right.
      A recipe migrated from before this change still carries the literal
      "av_extracted"; clearing the field is what adopts the fix.
    lands_in:
      - {target: jivaro.xml, section: general, option: viewsToReduce, line: 6}
    why: Which view Jivaro reduces. Derived from the DUT, overridable for a standalone run.

